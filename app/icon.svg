      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="7" y1="7" x2="19" y2="19" gradientUnits="userSpaceOnUse">
