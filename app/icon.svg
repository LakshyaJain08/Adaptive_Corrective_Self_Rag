  <line x1="18" y1="13" x2="20" y2="13" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <!-- Central 4-Point Neural Spark -->
  <path d="M13 8.5C13 11 10.5 13 8.5 13C10.5 13 13 15 13 17.5C13 15 15.5 13 17.5 13C15.5 13 13 11 13 8.5Z" fill="url(#sparkGrad)"/>
